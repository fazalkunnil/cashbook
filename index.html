<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ain Vogue">

<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Ain Vogue Cash Book</title>
<style>
:root{
  --plum:#6b2d5c;--plum2:#8a3d77;--plumSoft:#f4e9f1;--gold:#c99a2e;
  --bg:#faf6f8;--card:#ffffff;--ink:#231a20;--muted:#7a6d75;--line:#ece3e8;
  --green:#1d7a4a;--greenSoft:#e5f4ec;--red:#b3261e;--redSoft:#fbe9e7;--blueSoft:#e8f0fb;--blue:#2457a6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:16px}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;font-size:17px;color:var(--ink)}
.top{position:sticky;top:0;z-index:5;background:var(--plum);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
.top h1{font-size:19px;margin:0;flex:1;font-weight:700;letter-spacing:.2px}
.top .sub{font-size:12px;opacity:.8;font-weight:400;display:block}
.top .ib{width:38px;height:38px;border-radius:19px;background:rgba(255,255,255,.15);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
main{padding:14px 16px 20px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(60,20,50,.06);border:1px solid var(--line)}
.card h3{margin:0 0 10px;font-size:15px;color:var(--plum);font-weight:700}
.muted{color:var(--muted);font-size:13px}
.bal{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.bal>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.bal .l{font-size:12px;color:var(--muted)}
.bal .v{font-size:16px;font-weight:700;margin-top:4px;word-break:break-all}
.bal .ic{font-size:20px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:10px}
.row:last-child{border-bottom:0}
.row .r{font-weight:600;white-space:nowrap}
.row.tot{font-weight:700;font-size:17px}
.big{display:block;width:100%;padding:16px;border-radius:14px;background:var(--plum);color:#fff;font-weight:700;font-size:17px;text-align:center;margin-bottom:10px}
.big.alt{background:var(--card);color:var(--plum);border:2px solid var(--plum)}
.big.green{background:var(--green)}
.big.red{background:var(--red)}
.big.small{padding:12px;font-size:15px}
.btn2{display:flex;gap:8px}.btn2 .big{flex:1}
label.f{display:block;margin:12px 0 5px;font-size:14px;font-weight:600;color:#4a3d45}
.in{width:100%;padding:13px 12px;border:1.5px solid #dccfd7;border-radius:12px;background:#fff;appearance:none;-webkit-appearance:none}
.in:focus{outline:none;border-color:var(--plum)}
.amt{font-size:24px;font-weight:700;text-align:right}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:90px;padding:12px 8px;border-radius:12px;border:1.5px solid #dccfd7;background:#fff;text-align:center;font-weight:600;font-size:15px}
.chip.on{background:var(--plum);border-color:var(--plum);color:#fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:left;display:flex;gap:10px;align-items:center;font-weight:600;font-size:14.5px;line-height:1.2}
.tile .e{font-size:24px}
.sec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:16px 2px 8px}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700}
.pill.g{background:var(--greenSoft);color:var(--green)}.pill.r{background:var(--redSoft);color:var(--red)}.pill.b{background:var(--blueSoft);color:var(--blue)}.pill.p{background:var(--plumSoft);color:var(--plum)}
.pos{color:var(--green)}.neg{color:var(--red)}
.calc{background:var(--plumSoft);border-radius:14px;padding:12px 14px;margin-top:12px}
.calc .row{border-color:#e5d3df}
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.item .t span{font-size:12.5px;color:var(--muted)}
.item .a{font-weight:700;white-space:nowrap}
.x{width:32px;height:32px;border-radius:16px;background:var(--redSoft);color:var(--red);font-weight:700;flex:none}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow select{flex:1.3}.addrow input{flex:1}
.addrow button{flex:none;padding:0 16px;border-radius:12px;background:var(--plum);color:#fff;font-weight:700}
.seg{display:flex;background:#eadde5;border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:10px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--plum);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.banner{background:#fff6e0;border:1px solid #f0d78c;color:#6a4c00;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.banner.red{background:var(--redSoft);border-color:#efb8b2;color:var(--red)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0}
.nav button .e{font-size:22px;filter:grayscale(1);opacity:.6}
.nav button.on{color:var(--plum);font-weight:700}
.nav button.on .e{filter:none;opacity:1}
.nav .plus .e{background:var(--plum);color:#fff;width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;filter:none;opacity:1;margin-top:-18px;box-shadow:0 3px 8px rgba(107,45,92,.4);font-size:26px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));background:#231a20;color:#fff;padding:12px 18px;border-radius:24px;font-size:15px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.modalbg{position:fixed;inset:0;background:rgba(30,10,25,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.modal h2{margin:0 0 8px;font-size:19px}
.modal p{margin:6px 0 14px;color:#4a3d45;line-height:1.45}
/* PIN */
.pin{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--plum);color:#fff;padding:30px 20px calc(30px + env(safe-area-inset-bottom));margin-bottom:calc(-84px - env(safe-area-inset-bottom))}
.pin .logo{width:74px;height:74px;border-radius:18px;background:#f3d27a;color:var(--plum);font:700 30px Georgia,serif;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.pin h2{margin:0;font-size:22px}
.pin .msg{margin:8px 0 22px;opacity:.9;min-height:22px;text-align:center}
.dots{display:flex;gap:18px;margin-bottom:30px}
.dots i{width:16px;height:16px;border-radius:8px;border:2px solid #fff}
.dots i.on{background:#fff}
.dots.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px}
.pad button{width:76px;height:76px;border-radius:38px;background:rgba(255,255,255,.14);color:#fff;font-size:28px;font-weight:500}
.pad button.blank{background:none}
.pin .link{margin-top:24px;color:#fff;opacity:.8;text-decoration:underline;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:18px 6px;font-size:14px}
.warn{color:var(--red);font-size:13px;margin-top:6px}
.preview{background:#231a20;color:#fff;font-size:12.5px;text-align:center;padding:6px}
.syncline{background:#f4e9f1;color:var(--plum);font-size:12.5px;text-align:center;padding:5px 10px;position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:4}
.syncline.bad{background:#fff3e0;color:#8a5200}
button.banner{font:inherit;font-size:14px;display:block}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
/* =========================================================
   Ain Vogue Cash Book v2 — owner + staff, saved in Google Sheet
   ========================================================= */
const CONFIG_URL = '';   // ← Google Apps Script web app link (…/exec). Can also be pasted in the app.
const LS_CONN = 'av2_url', LS_AUTH = 'av2_auth', LS_DATA = 'av2_data';
const app = document.getElementById('app');

/* ---------- helpers ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad2 = n => String(n).padStart(2, '0');
const dstr = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const today = () => dstr(new Date());
const thisMonth = () => today().slice(0, 7);
const num = v => { const n = parseFloat(String(v ?? '').replace(/[,₹\s]/g, '')); return isFinite(n) ? Math.round(n * 100) / 100 : 0; };
const r2 = n => Math.round(n * 100) / 100;
const inr = n => { n = r2(n || 0); return (n < 0 ? '-' : '') + '₹' + Math.abs(n).toLocaleString('en-IN', { maximumFractionDigits: 2 }); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtD = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); return new Date(y, m - 1, dd).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); };
const fmtDshort = d => { const [y, m, dd] = d.split('-'); return new Date(y, m - 1, dd).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }); };
const monthName = m => { if (m === 'all') return 'All time'; const [y, mm] = m.split('-'); return new Date(y, mm - 1, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' }); };
const sum = (arr, f) => r2(arr.reduce((a, x) => a + (f ? f(x) : x), 0));
function localHash(p) { let h = 5381; const s = 'ainvogue#' + p + '#' + (URL_ || ''); for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return 'h' + h.toString(36); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { } }
function lsJSON(k) { try { return JSON.parse(lsGet(k) || 'null'); } catch (e) { return null; } }
if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) { } }

/* ---------- state ---------- */
const DEF_TYPES = ['Food Allowance', 'Cleaning', 'Tea / Snacks', 'Transport', 'Stationery', 'Repairs', 'Other'];
let URL_ = CONFIG_URL || lsGet(LS_CONN) || '';
let AUTH = lsJSON(LS_AUTH);             // {hash, role}
let D = lsJSON(LS_DATA) || { S: null, Q: [], last: null };
let S = D.S ? normalize(D.S) : null;
let Q = D.Q || [];
let PIN = null;
const role = () => AUTH ? AUTH.role : null;
const isOwner = () => role() === 'owner';
function persist() { D = { S, Q, last: D.last, role: D.role }; lsSet(LS_DATA, JSON.stringify(D)); }
function normalize(x) {
  return {
    shop: x.shop || 'Ain Vogue', setup: !!x.setup,
    start: x.start && x.start.date ? x.start : { date: today(), shop: 0, cash: 0, bank: 0, loan: 0 },
    expenseTypes: x.expenseTypes && x.expenseTypes.length ? x.expenseTypes : DEF_TYPES.slice(),
    commission: x.commission || {}, staffName: x.staffName || '', staffPinSet: !!x.staffPinSet,
    suppliers: x.suppliers || [], staff: x.staff || [], days: x.days || {}, tx: x.tx || [], requests: x.requests || []
  };
}

/* ---------- money types ---------- */
const ACC = { shop: 'Shop cash', cash: 'My cash', bank: 'Bank' };
const ACC_IC = { shop: '🏪', cash: '👛', bank: '🏦' };
const K = {
  shop_exp:   { l: 'Shop expense',        g: 'out',  ic: '🧾', def: 'shop', exp: 1, cat: 1 },
  cash_buy:   { l: 'Cash purchase',       g: 'out',  ic: '🛍️', def: 'cash', exp: 1, hint: 'Stock bought and paid immediately' },
  sup_pay:    { l: 'Pay supplier',        g: 'out',  ic: '🤝', def: 'bank', sup: 1, hint: 'Payment towards credit supplier balance' },
  credit_buy: { l: 'Credit purchase',     g: 'credit', ic: '📦', sup: 1, hint: 'Stock bought now, to pay later. No money moves.' },
  advance:    { l: 'Salary advance',      g: 'out',  ic: '💵', def: 'shop', exp: 1, staff: 1 },
  salary:     { l: 'Salary payment',      g: 'out',  ic: '👛', def: 'cash', exp: 1, staff: 1, hint: 'Balance salary paid' },
  commission: { l: 'Commission payment',  g: 'out',  ic: '⭐', def: 'cash', exp: 1, staff: 1 },
  rent:       { l: 'Rent',                g: 'out',  ic: '🏬', def: 'bank', exp: 1 },
  electricity:{ l: 'Electricity',         g: 'out',  ic: '💡', def: 'bank', exp: 1 },
  other_exp:  { l: 'Other expense',       g: 'out',  ic: '📝', def: 'cash', exp: 1, hint: 'Write what it was in the note' },
  home:       { l: 'Taken for home',      g: 'out',  ic: '🏡', def: 'cash', hint: 'Money used for home / personal' },
  loan_out:   { l: 'Loan repayment',      g: 'out',  ic: '🏦', def: 'bank' },
  loan_in:    { l: 'Loan received',       g: 'in',   ic: '💰', def: 'bank' },
  other_in:   { l: 'Other money received',g: 'in',   ic: '➕', def: 'cash' },
  collect:    { l: 'Cash taken from shop',g: 'move', ic: '👜', from: 'shop', to: 'cash' },
  deposit:    { l: 'Deposit cash in bank',g: 'move', ic: '⬆️', fromOpts: ['cash', 'shop'], to: 'bank' },
  withdraw:   { l: 'Withdraw from bank',  g: 'move', ic: '⬇️', from: 'bank', to: 'cash' },
};
const kOf = t => K[t.k] || { l: t.kname || t.k, g: 'move', ic: '•' };

/* ---------- server ---------- */
async function api(body) {
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 30000);
  try {
    const r = await fetch(URL_, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow', signal: ctl.signal });
    return await r.json();
  } finally { clearTimeout(tm); }
}
let syncing = false, syncAgain = false, inflight = 0, online = true, syncErr = '';
async function sync() {
  if (!PIN || !URL_) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; const ops = Q.slice(); inflight = ops.length; syncUI();
  try {
    const res = await api({ a: 'sync', pin: PIN, ops });
    online = true;
    if (!res.ok) {
      if (res.err === 'auth') { authLost('Your PIN was changed. Please enter the new PIN.'); }
      else if (res.err === 'locked') { syncErr = 'Too many wrong PINs. Wait 15 minutes.'; }
      else syncErr = res.err || 'error';
    } else {
      Q.splice(0, ops.length); syncErr = '';
      const bad = (res.results || []).filter(x => !x.ok), reqs = (res.results || []).filter(x => x.request).length;
      const wasSetup = S && S.setup;
      S = normalize(res.state); Q.forEach(o => applyLocal(o));
      D.last = Date.now(); persist();
      if (bad.length) toast('Not saved: ' + bad[0].err);
      else if (reqs) toast('Sent to owner for approval ✓');
      softRender(wasSetup !== S.setup);
    }
  } catch (e) { online = false; }
  syncing = false; inflight = 0; syncUI();
  if (syncAgain) { syncAgain = false; sync(); }
}
function authLost(msg) {
  AUTH = null; lsSet(LS_AUTH, null); PIN = null; locked = true; pinMode = null; pinBuf = ''; pinMsg = msg; helloState = null; closeModal(); render();
}
function syncText() {
  if (syncErr) return '⚠ ' + syncErr;
  if (syncing) return '⏳ Saving…';
  if (!online) return Q.length ? `⚠ Offline · ${Q.length} waiting to upload` : '⚠ Offline';
  if (Q.length) return `⏳ ${Q.length} waiting to upload`;
  if (D.last) return '✓ Saved online ' + new Date(D.last).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
  return '';
}
function syncUI() { const el = document.getElementById('syncline'); if (el) { el.textContent = syncText(); el.className = 'syncline' + ((!online || syncErr) ? ' bad' : ''); } }
setInterval(() => { if (!locked && PIN && !document.hidden) sync(); }, 60000);
window.addEventListener('online', () => { if (!locked && PIN) sync(); });

/* ---------- local apply (mirrors server rules) ---------- */
function dayAccepted(d) { const x = S.days[d]; return !!(x && x.status === 'accepted'); }
function localReq(date, summary) { S.requests.push({ id: 'local-' + uid(), date, summary, requested: 'waiting to upload', local: true }); }
function applyLocal(o) {
  const staff = !isOwner();
  switch (o.t) {
    case 'day': {
      const ex = S.days[o.rec.date];
      if (staff && ex && ex.status === 'accepted') { localReq(o.rec.date, 'Change day figures'); return 'req'; }
      S.days[o.rec.date] = { ...o.rec, status: staff ? 'pending' : (ex ? ex.status : 'accepted'), by: staff ? 'staff' : (ex ? ex.by : 'owner') };
      return 'ok';
    }
    case 'delday': {
      if (staff && dayAccepted(o.date)) { localReq(o.date, 'Clear day figures'); return 'req'; }
      delete S.days[o.date]; return 'ok';
    }
    case 'tx': {
      const i = S.tx.findIndex(x => x.id === o.rec.id); const ex = i >= 0 ? S.tx[i] : null;
      if (staff && (dayAccepted(o.rec.date) || (ex && dayAccepted(ex.date)))) { localReq(o.rec.date, (K[o.rec.k] || {}).l + ' ' + inr(o.rec.amt)); return 'req'; }
      const t = { ...o.rec, kname: (K[o.rec.k] || {}).l, status: staff ? 'pending' : (ex ? ex.status : 'ok'), by: staff ? 'staff' : (ex ? ex.by : 'owner'), created: ex ? ex.created : new Date().toISOString() };
      if (t.staff) { const s = S.staff.find(z => z.id === t.staff); t.staffName = s ? s.name : ''; }
      if (i >= 0) S.tx[i] = t; else S.tx.push(t);
      return 'ok';
    }
    case 'deltx': {
      const t = S.tx.find(x => x.id === o.id); if (!t) return 'ok';
      if (staff && dayAccepted(t.date)) { localReq(t.date, 'Delete ' + txLabel(t)); return 'req'; }
      S.tx = S.tx.filter(x => x.id !== o.id); return 'ok';
    }
    case 'sup': { const i = S.suppliers.findIndex(x => x.id === o.rec.id); if (i >= 0) S.suppliers[i] = { ...o.rec }; else S.suppliers.push({ ...o.rec }); return 'ok'; }
    case 'staff': { const i = S.staff.findIndex(x => x.id === o.rec.id); if (i >= 0) S.staff[i] = { ...o.rec }; else S.staff.push({ ...o.rec }); return 'ok'; }
    case 'delsup': S.suppliers = S.suppliers.filter(x => x.id !== o.id); return 'ok';
    case 'delstaff': S.staff = S.staff.filter(x => x.id !== o.id); return 'ok';
    case 'set': {
      if (o.key === 'expenseTypes' && staff) { o.value.forEach(v => { if (!S.expenseTypes.includes(v)) S.expenseTypes.push(v); }); return 'ok'; }
      S[o.key] = o.value; return 'ok';
    }
    case 'accept': {
      if (S.days[o.date]) S.days[o.date].status = 'accepted';
      S.tx.forEach(t => { if (t.date === o.date && t.status === 'pending') t.status = 'ok'; });
      return 'ok';
    }
    case 'decide': {
      const rq = S.requests.find(r => r.id === o.id);
      S.requests = S.requests.filter(r => r.id !== o.id);
      if (o.approve && rq && rq.data) { try { const inner = JSON.parse(rq.data); applyLocal(inner); if (inner.t === 'tx') { const t = S.tx.find(x => x.id === inner.rec.id); if (t) { t.status = 'ok'; t.by = 'staff'; } } } catch (e) { } }
      return 'ok';
    }
  }
  return 'ok';
}
function commit(o) {
  const r = applyLocal(o); Q.push(o); persist(); sync(); return r;
}
let dayTimer = null;
function commitDayDebounced(rec, date) {
  if (rec) applyLocal({ t: 'day', rec }); else delete S.days[date];
  if (rec) date = rec.date;
  persist();
  clearTimeout(dayTimer);
  dayTimer = setTimeout(() => {
    dayTimer = null; flushDay(date);
  }, 1200);
}

/* ---------- calculations ---------- */
function ledger() {
  const st = S.start;
  const b = { shop: num(st.shop), cash: num(st.cash), bank: num(st.bank) };
  const byDate = {};
  S.tx.forEach(t => { (byDate[t.date] = byDate[t.date] || []).push(t); });
  const dates = [...new Set([...Object.keys(S.days), ...Object.keys(byDate)])].filter(d => d >= st.date).sort();
  const out = {};
  for (const d of dates) {
    const open = { ...b }; const day = S.days[d]; let adj = null, expected = null;
    if (day) {
      const cs = num(day.sales) - num(day.upi) - num(day.online);
      b.shop += cs - num(day.taken); b.bank += num(day.upi) + num(day.online); b.cash += num(day.taken);
    }
    (byDate[d] || []).forEach(t => { if (t.from && b[t.from] !== undefined) b[t.from] -= num(t.amt); if (t.to && b[t.to] !== undefined) b[t.to] += num(t.amt); });
    if (day && day.counted !== null && day.counted !== undefined && day.counted !== '') {
      expected = r2(b.shop); adj = r2(num(day.counted) - b.shop); b.shop = num(day.counted);
    }
    Object.keys(b).forEach(k => b[k] = r2(b[k]));
    out[d] = { open, close: { ...b }, adj, expected };
  }
  return { days: out, bal: { ...b } };
}
function openOn(L, d) {
  let last = null;
  for (const k of Object.keys(L.days)) { if (k < d && (!last || k > last)) last = k; }
  return last ? L.days[last].close : { shop: num(S.start.shop), cash: num(S.start.cash), bank: num(S.start.bank) };
}
function supBal(s) {
  let b = num(s.opening);
  S.tx.forEach(t => { if (t.sup === s.id) { if (t.k === 'credit_buy') b += num(t.amt); if (t.k === 'sup_pay') b -= num(t.amt); } });
  return r2(b);
}
function staffMonth(s, m) {
  const com = num(S.commission[s.id + '|' + m]);
  const txs = S.tx.filter(t => t.staff === s.id && t.month === m);
  const adv = sum(txs.filter(t => t.k === 'advance'), t => num(t.amt));
  const paid = sum(txs.filter(t => t.k === 'salary'), t => num(t.amt));
  const comPaid = sum(txs.filter(t => t.k === 'commission'), t => num(t.amt));
  const total = r2(num(s.salary) + com);
  return { com, adv, paid, comPaid, total, given: r2(adv + paid + comPaid), due: r2(total - adv - paid - comPaid), txs };
}
function loanBal() { return r2(num(S.start.loan) + sum(S.tx.filter(t => t.k === 'loan_in'), t => num(t.amt)) - sum(S.tx.filter(t => t.k === 'loan_out'), t => num(t.amt))); }
function staffNameOf(id, t) { const x = S.staff.find(z => z.id === id); return x ? x.name : (t && t.staffName) || ''; }
function txLabel(t) {
  let s = t.k === 'shop_exp' ? (t.cat || 'Shop expense') : kOf(t).l;
  if (t.sup) { const x = S.suppliers.find(z => z.id === t.sup); if (x) s += ' · ' + x.name; }
  if (t.staff) { const n = staffNameOf(t.staff, t); if (n) s += ' · ' + n; }
  return s;
}
function txFlow(t) {
  if (t.k === 'credit_buy') return 'To pay later';
  if (t.from && t.to) return ACC[t.from] + ' → ' + ACC[t.to];
  if (t.from) return 'From ' + ACC[t.from];
  if (t.to) return 'Into ' + ACC[t.to];
  return '';
}
function pendingDates() {
  const set = new Set();
  Object.keys(S.days).forEach(d => { if (S.days[d].status === 'pending') set.add(d); });
  S.tx.forEach(t => { if (t.status === 'pending') set.add(t.date); });
  return [...set].sort();
}
function periodData(m) {
  const inP = d => m === 'all' || d.startsWith(m);
  const L = ledger();
  const dayKeys = Object.keys(S.days).filter(inP).sort();
  const days = dayKeys.map(d => S.days[d]);
  const sales = sum(days, x => num(x.sales)), upi = sum(days, x => num(x.upi)), online = sum(days, x => num(x.online));
  const taken = sum(days, x => num(x.taken));
  const txs = S.tx.filter(t => inP(t.date));
  const bizExp = {}, otherPay = {};
  txs.forEach(t => {
    const k = kOf(t); if (k.g !== 'out') return;
    const lab = t.k === 'shop_exp' ? (t.cat || 'Shop expense') : k.l;
    const tgt = k.exp ? bizExp : otherPay;
    tgt[lab] = r2((tgt[lab] || 0) + num(t.amt));

  const moneyIn = {}; txs.filter(t => kOf(t).g === 'in').forEach(t => moneyIn[kOf(t).l] = r2((moneyIn[kOf(t).l] || 0) + num(t.amt)));
  const creditBuy = sum(txs.filter(t => t.k === 'credit_buy'), t => num(t.amt));
  const shortEx = sum(Object.keys(L.days).filter(inP), d => L.days[d].adj || 0);
  return { L, dayKeys, sales, upi, online, cashSales: r2(sales - upi - online), taken, txs, bizExp, otherPay, moneyIn, creditBuy, shortEx,
    bizTotal: sum(Object.values(bizExp)), otherTotal: sum(Object.values(otherPay)) };
}

function pinKey(k) {

  if (k === 'del') { pinBuf = pinBuf.slice(0, -1); return renderPin(); }

}
function pinShake(msg) { pinMsg = msg; pinBuf = ''; busy = false; renderPin(); const d = document.getElementById('dots'); if (d) d.classList.add('shake'); }

async function pinDone() {
  const p = pinBuf;
  if (pinMode === 'set' || pinMode === 'newpin') { pinFirst = p; pinBuf = ''; pinMode = pinMode === 'set' ? 'confirm' : 'newconfirm'; pinMsg = 'Enter the same PIN again'; return renderPin(); }
  if (pinMode === 'confirm') {
    if (p !== pinFirst) { pinMode = 'set'; return pinShake('PINs did not match. Try again.'); }
    busy = true; renderPin();
    try {
      const r = await api({ a: 'init', pin: p });
      if (!r.ok) { helloState = 'ready'; pinMode = 'login'; return pinShake(r.err === 'already set' ? 'Owner PIN already exists. Enter your PIN.' : r.err); }
      finishLogin(p, 'owner');
    } catch (e) { pinMode = 'set'; pinShake('No internet. Try again.'); }
    return;
  }
  if (pinMode === 'login') {
    busy = true; renderPin();
    try {
      const r = await api({ a: 'login', pin: p });
      if (!r.ok) return pinShake(r.err === 'locked' ? 'Too many wrong tries. Wait 15 minutes.' : 'Wrong PIN. Try again.');
      finishLogin(p, r.role);
    } catch (e) { pinShake('No internet. Try again.'); }
    return;
  }
  if (pinMode === 'unlock') {
    if (localHash(p) === AUTH.hash) { PIN = p; locked = false; pinBuf = ''; pinMode = null; pinMsg = ''; render(); sync(); }
    else pinShake('Wrong PIN. Try again.');
    return;
  }
  if (pinMode === 'chkold') {
    if (localHash(p) === AUTH.hash) { pinBuf = ''; pinMode = 'newpin'; pinMsg = 'Enter your new 4-digit PIN'; renderPin(); } else pinShake('Wrong PIN');
    return;
  }
  if (pinMode === 'newconfirm') {
    if (p !== pinFirst) { pinMode = 'newpin'; return pinShake('PINs did not match. Try again.'); }
    busy = true; renderPin();
    try {
      const r = await api({ a: 'sync', pin: PIN, ops: [{ t: 'ownerPin', pin: p }] });
      const res = r.ok && r.results && r.results[0];
      if (!res || !res.ok) { pinMode = 'newpin'; return pinShake((res && res.err) || r.err || 'Could not change PIN'); }
      busy = false; PIN = p; saveAuth(p, 'owner'); pinBuf = ''; pinMode = null; locked = false; go('settings'); toast('PIN changed ✓');
    } catch (e) { busy = false; pinBuf = ''; pinMode = null; locked = false; go('settings'); toast('No internet. PIN not changed.'); }
  }
}

  <div class="card">

  </div>

    ${exps.length ? exps.map(t => `<div class="item"><div class="t"><b>${esc(t.cat || 'Shop expense')}${pendPill(t)}</b>${t.note ? `<span>${esc(t.note)}</span>` : ''}</div><div class="a">${inr(t.amt)}</div>${canDel(t) ? `<button class="x" onclick="delTx('${t.id}')">×</button>` : ''}</div>`).join('') : '<div class="muted">No expenses added yet.</div>'}

      <button onclick="addDayExp()">Add</button>

    `<div id="c_saved" class="muted" style="text-align:center;margin-bottom:8px">${S.days[d] ? '✓ Saved' : 'Everything saves automatically as you type'}</div><button class="big" onclick="dayDone()">Done</button>`}

function dayVals() {
  const g = id => document.getElementById(id).value;
  return { sales: g('d_sales'), upi: g('d_upi'), online: g('d_online'), taken: g('d_taken'), counted: g('d_counted'), note: g('d_note') };
}
function dayRec(f) { return { date: curDay, sales: num(f.sales), upi: num(f.upi), online: num(f.online), taken: num(f.taken), counted: f.counted.trim() === '' ? null : num(f.counted), note: f.note.trim() }; }
function dayCalc(doSave) {
  const d = curDay; const f = dayVals();
  const open = openOn(ledger(), d).shop;
  const cash = r2(num(f.sales) - num(f.upi) - num(f.online));
  const shopTx = S.tx.filter(t => t.date === d && (t.from === 'shop' || t.to === 'shop'));
  const out = r2(sum(shopTx.filter(t => t.from === 'shop'), t => num(t.amt)) - sum(shopTx.filter(t => t.to === 'shop'), t => num(t.amt)));
  const taken = num(f.taken);
  const expected = r2(open + cash - out - taken);
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('c_cash', inr(cash)); set('c_cash2', inr(cash)); set('c_exp', inr(out)); set('c_taken', inr(taken)); set('c_expected', inr(expected));
  document.getElementById('c_warn').style.display = cash < 0 ? 'block' : 'none';
  const dEl = document.getElementById('c_diff');
  if (f.counted.trim() === '') dEl.innerHTML = '<div class="hint">Count the cash at closing time and enter it to check for shortage.</div>';
  else {
    const diff = r2(num(f.counted) - expected);
    dEl.innerHTML = diff === 0 ? '<span class="pill g">✓ Cash matches</span>' :
      diff < 0 ? `<span class="pill r">Short by ${inr(-diff)}</span><div class="hint">Tomorrow's opening will use the counted cash.</div>` :
        `<span class="pill b">Extra ${inr(diff)}</span><div class="hint">Tomorrow's opening will use the counted cash.</div>`;
  }
  if (doSave) {
    const hasAny = ['sales', 'upi', 'online', 'taken', 'counted', 'note'].some(k => String(f[k]).trim() !== '');
    if (hasAny) commitDayDebounced(dayRec(f));
    else if (S.days[d]) commitDayDebounced(null, d);
    set('c_saved', hasAny ? '✓ Saved' : 'Everything saves automatically as you type');
  }
}
function sendDayChange() {
  const rec = dayRec(dayVals());
  const r = commit({ t: 'day', rec });
  if (r === 'req') { toast('Sent to owner for approval'); render(); }
}
function addGuard(cb) {
  if (!isOwner() && dayAccepted(curDay)) ask('Day already accepted', 'The owner has accepted this day. This change will be sent to her for approval.', 'Send for approval', '', cb);
  else cb();
}
function addDayExp() {
  const cat = document.getElementById('e_cat').value; const amt = num(document.getElementById('e_amt').value);
  if (cat === '__new') return newExpType('day');
  if (amt <= 0) return toast('Enter the amount');
  addGuard(() => {
    if (!(!isOwner() && dayAccepted(curDay))) dayCalc(true);
    const r = commit({ t: 'tx', rec: { id: uid(), date: curDay, k: 'shop_exp', amt, from: 'shop', cat, note: '' } });
    render(); toast(r === 'req' ? 'Sent for approval' : 'Expense added');
  });
}
function addDayAdv() {
  const staff = document.getElementById('a_staff').value; const amt = num(document.getElementById('a_amt').value);
  if (amt <= 0) return toast('Enter the amount');
  addGuard(() => {
    if (!(!isOwner() && dayAccepted(curDay))) dayCalc(true);
    const r = commit({ t: 'tx', rec: { id: uid(), date: curDay, k: 'advance', amt, from: 'shop', staff, month: curDay.slice(0, 7), note: '' } });
    render(); toast(r === 'req' ? 'Sent for approval' : 'Advance added');
  });
}
function dayDone() { dayCalc(true); if (dayTimer) { clearTimeout(dayTimer); dayTimer = null; flushDay(); } if (isOwner()) go('home'); else go('past'); toast(S.days[curDay] ? 'Shop day saved ✓' : 'Nothing entered'); }
function delDay() {
  ask('Clear sales entry?', 'This removes the sales, cash given and counted cash for ' + fmtD(curDay) + '. Expenses stay.', 'Clear', 'red', () => {
    if (dayTimer) { clearTimeout(dayTimer); dayTimer = null; }
    const r = commit({ t: 'delday', date: curDay }); render(); toast(r === 'req' ? 'Sent for approval' : 'Cleared');
  });
}
function delTx(id) {
  const t = S.tx.find(x => x.id === id);
  const needReq = !isOwner() && dayAccepted(t.date);
  ask(needReq ? 'Ask owner to delete?' : 'Delete entry?', esc(txLabel(t)) + ' — ' + inr(t.amt) + (needReq ? '<br>This day is accepted, so the owner must approve.' : ''), needReq ? 'Send request' : 'Delete', 'red', () => {
    const r = commit({ t: 'deltx', id });
    if (V.name === 'form') go('history'); else render();
    toast(r === 'req' ? 'Sent for approval' : 'Deleted');
  });
}
function newExpType(from) {
  window._netFrom = from;
  modal(`<h2>New expense type</h2><input class="in" id="net" placeholder="e.g. Packing material"><div class="btn2" style="margin-top:14px"><button class="big alt small" onclick="closeModal();render()">Cancel</button><button class="big small" onclick="saveExpType()">Add</button></div>`);
  setTimeout(() => document.getElementById('net').focus(), 50);
}
function saveExpType() {
  const v = document.getElementById('net').value.trim(); if (!v) return toast('Type a name');

function saveForm() {
  const g = id => { const el = document.getElementById(id); return el ? el.value : null; };

  const amt = num(g('f_amt')); if (amt <= 0) return toast('Enter the amount');
  const date = g('f_date'); if (!date) return toast('Choose the date');
  if (date < S.start.date) return toast('Date is before the start date');
  const t = { id: F.id || uid(), date, k: F.k, amt, note: (g('f_note') || '').trim() };
  if (k.g === 'out' || k.fromOpts || k.from) t.from = k.from || F.from;
  if (k.g === 'in' || k.to) t.to = k.to || F.to;
  if (k.sup) { t.sup = g('f_sup'); if (!t.sup) return toast('Choose a supplier'); }
  if (k.staff) { t.staff = g('f_staff'); t.month = g('f_month') || thisMonth(); if (!t.staff) return toast('Choose staff'); }

  if (V.p.back === 'supplier') go('supplier', { id: t.sup });
  else if (V.p.back === 'staff') go('staff', { id: t.staff });
  else go(wasEdit ? 'history' : 'home');

  if ((t.from === 'shop' || t.to === 'shop') && dd && dd.counted !== null && dd.counted !== undefined) toast('Saved ✓ — shop cash was already counted that day. Please re-check the count.');

  const early = S.tx.some(t => t.date < d) || Object.keys(S.days).some(x => x < d);
  if (early) return toast('Some entries are before this date. Choose an earlier date.');
  commit({ t: 'set', key: 'start', value: { date: d, shop: num(g('st_shop')), cash: num(g('st_cash')), bank: num(g('st_bank')), loan: num(g('st_loan')) } });
  toast('Starting figures saved'); render();
}
async function onlineOps(ops, okMsg) {
  if (!PIN) return false;
  try {
    const r = await api({ a: 'sync', pin: PIN, ops: [...Q, ...ops] });
    if (!r.ok) { toast(r.err || 'Failed'); return false; }
    const mine = r.results.slice(Q.length); Q = []; S = normalize(r.state); D.last = Date.now(); persist();
    const bad = mine.find(x => !x.ok); if (bad) { toast(bad.err); render(); return false; }
    toast(okMsg); render(); return true;
  } catch (e) { toast('Needs internet. Please try again when online.'); return false; }
}

/* ---------- Share / backup ---------- */
async function shareFile(name, blob, type) {
  const file = new File([blob], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return true; }
    catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  return true;
}
async function backup() {
  const data = JSON.stringify({ app: 'ainvogue-cashbook', exported: new Date().toISOString(), data: S });
  if (await shareFile('AinVogue-backup-' + today() + '.json', new Blob([data], { type: 'application/json' }), 'application/json')) toast('Backup file created ✓');
}

/* ---------- Excel (.xlsx) writer, no internet needed ---------- */
const CRC = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u) { let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zip(files) {
  const enc = new TextEncoder(); const parts = [], central = []; let off = 0;
  files.forEach(f => {
    const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(8, 0, true);
    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true);
    parts.push(new Uint8Array(h.buffer), name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true); c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), name);
    off += 30 + name.length + data.length;
  });
  const csize = central.reduce((a, x) => a + x.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csize, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}
const xesc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
function colL(i) { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
function excelSerial(d) { const [y, m, dd] = d.split('-').map(Number); return (Date.UTC(y, m - 1, dd) - Date.UTC(1899, 11, 30)) / 86400000; }
// cell: string | number | {d:'YYYY-MM-DD'} | {h:'Header'} | {b:'Bold text'} | {n:number, b:1}
function sheetXml(rows, widths) {
  const cols = widths ? '<cols>' + widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('') + '</cols>' : '';
  const body = rows.map((r, ri) => '<row r="' + (ri + 1) + '">' + r.map((c, ci) => {
    const ref = colL(ci) + (ri + 1);
    if (c === null || c === undefined || c === '') return '';
    if (typeof c === 'number') return `<c r="${ref}" s="3"><v>${r2(c)}</v></c>`;
    if (typeof c === 'string') return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xesc(c)}</t></is></c>`;
    if (c.d) return `<c r="${ref}" s="2"><v>${excelSerial(c.d)}</v></c>`;
    if (c.h !== undefined) return `<c r="${ref}" s="1" t="inlineStr"><is><t>${xesc(c.h)}</t></is></c>`;
    if (c.t !== undefined) return `<c r="${ref}" s="4" t="inlineStr"><is><t>${xesc(c.t)}</t></is></c>`;
    if (c.n !== undefined) return `<c r="${ref}" s="5"><v>${r2(c.n)}</v></c>`;
    return '';
  }).join('') + '</row>').join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${cols}<sheetData>${body}</sheetData></worksheet>`;
}
function buildXlsx(sheets) {
  const files = [
    { name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>` },
    { name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${xesc(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>` },
    { name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
    { name: 'xl/styles.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="2"><numFmt numFmtId="164" formatCode="dd\\-mmm\\-yyyy"/><numFmt numFmtId="165" formatCode="#,##0.00"/></numFmts><fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF6B2D5C"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="6"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="165" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>` },
  ];
  sheets.forEach((s, i) => files.push({ name: `xl/worksheets/sheet${i + 1}.xml`, data: sheetXml(s.rows, s.widths) }));
  return zip(files);
}
function excelData(m) {
  const P = periodData(m); const L = P.L; const inP = d => m === 'all' || d.startsWith(m);
  const title = S.shop + ' — ' + monthName(m);
  // Summary
  const sum1 = [[{ t: title }], ['Exported on', { d: today() }], [],
    [{ h: 'SALES' }, { h: 'Amount (₹)' }], ['Total sales', P.sales], ['Cash sales', P.cashSales], ['UPI', P.upi], ['Online', P.online], ['Days entered', P.dayKeys.length], ['Cash short (−) / extra (+)', P.shortEx], [],
    [{ h: 'BUSINESS EXPENSES' }, { h: 'Amount (₹)' }], ...Object.entries(P.bizExp).sort((a, b) => b[1] - a[1]), [{ t: 'Total expenses' }, { n: P.bizTotal }], [],
    [{ h: 'OTHER PAYMENTS' }, { h: 'Amount (₹)' }], ...Object.entries(P.otherPay), [{ t: 'Total' }, { n: P.otherTotal }], [],
    [{ h: 'OTHER MONEY RECEIVED' }, { h: 'Amount (₹)' }], ...Object.entries(P.moneyIn), [],
    ['Credit purchases (to pay later)', P.creditBuy], [],
    [{ h: 'BALANCES NOW' }, { h: 'Amount (₹)' }], ['Shop cash', L.bal.shop], ['My cash', L.bal.cash], ['Bank', L.bal.bank], [{ t: 'Total' }, { n: L.bal.shop + L.bal.cash + L.bal.bank }], ['Owed to suppliers', sum(S.suppliers, supBal)], ['Loan to repay', loanBal()]];
  // Daily
  const daily = [[{ h: 'Date' }, { h: 'Opening cash' }, { h: 'Total sales' }, { h: 'UPI' }, { h: 'Online' }, { h: 'Cash sales' }, { h: 'Shop expenses/payments' }, { h: 'Cash taken by me' }, { h: 'Expected closing' }, { h: 'Counted cash' }, { h: 'Short(−)/Extra(+)' }, { h: 'Closing cash' }, { h: 'Note' }]];
  Object.keys(L.days).filter(inP).sort().forEach(d => {
    const x = L.days[d], day = S.days[d] || {};
    const shopOut = r2(sum(S.tx.filter(t => t.date === d && t.from === 'shop'), t => num(t.amt)) - sum(S.tx.filter(t => t.date === d && t.to === 'shop'), t => num(t.amt)));
    const cs = r2(num(day.sales) - num(day.upi) - num(day.online));
    const exp = x.expected !== null ? x.expected : x.close.shop;
    daily.push([{ d }, x.open.shop, num(day.sales), num(day.upi), num(day.online), cs, shopOut, num(day.taken), exp, day.counted !== null && day.counted !== undefined ? num(day.counted) : '', x.adj || 0, x.close.shop, day.note || '']);
  });

  P.txs.slice().sort((a, b) => (a.date + a.ts).localeCompare(b.date + b.ts)).forEach(t => {
    const who = t.sup ? (S.suppliers.find(x => x.id === t.sup) || {}).name : t.staff ? (S.staff.find(x => x.id === t.staff) || {}).name : '';
    ent.push([{ d: t.date }, kOf(t).l, t.cat || '', who || '', t.month ? monthName(t.month) : '', t.from ? ACC[t.from] : (t.k === 'credit_buy' ? 'Credit' : ''), t.to ? ACC[t.to] : '', num(t.amt), t.note || '']);
  });
  // Suppliers
  const sup = [[{ h: 'Supplier' }, { h: 'Starting balance' }, { h: 'Credit purchases (all)' }, { h: 'Paid (all)' }, { h: 'Balance owed now' }, { h: 'Purchases in period' }, { h: 'Paid in period' }]];
  S.suppliers.forEach(s => {
    const all = S.tx.filter(t => t.sup === s.id), per = all.filter(t => inP(t.date));
    sup.push([s.name, num(s.opening), sum(all.filter(t => t.k === 'credit_buy'), t => num(t.amt)), sum(all.filter(t => t.k === 'sup_pay'), t => num(t.amt)), supBal(s), sum(per.filter(t => t.k === 'credit_buy'), t => num(t.amt)), sum(per.filter(t => t.k === 'sup_pay'), t => num(t.amt))]);
  });
  // Staff
  const months = m === 'all' ? [...new Set([...S.tx.filter(t => t.month).map(t => t.month), ...Object.keys(S.commission).map(k => k.split('|')[1])])].sort() : [m];
  const st = [[{ h: 'Month' }, { h: 'Staff' }, { h: 'Salary' }, { h: 'Commission' }, { h: 'Total earned' }, { h: 'Advances' }, { h: 'Salary paid' }, { h: 'Commission paid' }, { h: 'Balance to pay' }]];
  months.forEach(mo => S.staff.forEach(s => { const x = staffMonth(s, mo); st.push([monthName(mo), s.name, num(s.salary), x.com, x.total, x.adv, x.paid, x.comPaid, x.due]); }));

    { name: 'Summary', rows: sum1, widths: [34, 16] },
    { name: 'Daily Shop', rows: daily, widths: [13, 13, 13, 12, 12, 13, 16, 14, 15, 13, 14, 13, 24] },
    { name: 'All Entries', rows: ent, widths: [13, 22, 22, 18, 15, 12, 12, 13, 28] },
    { name: 'Suppliers', rows: sup, widths: [18, 15, 18, 14, 16, 17, 15] },
    { name: 'Staff Salary', rows: st, widths: [16, 14, 12, 13, 13, 12, 12, 15, 15] },

}
async function shareExcel(m) {
  const blob = buildXlsx(excelData(m));
  const name = 'AinVogue-' + (m === 'all' ? 'All-' + today() : m) + '.xlsx';
  await shareFile(name, blob, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
